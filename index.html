function fromB64(s) {
  const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decrypt(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: fromB64(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(IV) }, key, fromB64(CT));
  return new TextDecoder().decode(pt);
}

// Hard-replace the gate with the decrypted page, rendered into a full-screen
// same-origin frame. document.write() must NOT be used here: several mobile
// browsers append the written markup instead of replacing the document (or
// block post-load document.write outright as an intervention), which leaves the
// lock panel painted over/next to the dashboard. Reported on a phone, Sep 2026.
function render(html) {
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const pageTitle = (doc.querySelector('title') && doc.querySelector('title').textContent) || 'AGENT HQ';
    // Relative URLs (status.json, assets) must resolve against THIS page, not the
    // frame's own blob:/about:srcdoc URL.
    const baseTag = '<base href="' + location.href.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">';
    const page = html.replace(/<head([^>]*)>/i, '<head$1>' + baseTag);

    document.title = pageTitle;
    document.head.innerHTML = '<title>' + pageTitle + '</title>';   // drop the gate's styles entirely
    document.documentElement.style.cssText = 'margin:0;padding:0;height:100%;background:#0b0d17';
    document.body.style.cssText = 'margin:0;padding:0;overflow:hidden;background:#0b0d17';
    document.body.innerHTML = '';                                    // drop the lock panel

    const frame = document.createElement('iframe');
    frame.setAttribute('title', pageTitle);
    frame.setAttribute('allow', 'clipboard-write');
    frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d17';
    // keep external links (the Telegram switch deep-link) from navigating inside the frame
    frame.addEventListener('load', () => {
      try {
        frame.contentDocument.querySelectorAll('a[href]').forEach(a => {
          a.target = '_blank';
          a.rel = 'noopener';
        });
      } catch (x) {}
    });
    try {
      frame.src = URL.createObjectURL(new Blob([page], { type: 'text/html' }));
    } catch (x) {
      frame.srcdoc = page;                                           // fallback: no blob URL support
    }
    document.body.appendChild(frame);
  } catch (x) {
    document.open(); document.write(html); document.close();        // last resort
  }
}

// refresh within the same tab shouldn't re-prompt (cleared when the tab closes)
const cached = sessionStorage.getItem('hq_unlocked_5cd956a6cdb2');
if (cached) {
  render(cached);
} else {
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    errEl.textContent = '';
    goEl.disabled = true;
    goEl.textContent = 'DECRYPTING\u2026';
    try {
      const html = await decrypt(pwEl.value);
      try { sessionStorage.setItem('hq_unlocked_5cd956a6cdb2', html); } catch (x) {}
      render(html);
    } catch (x) {
      errEl.textContent = (x && x.name === 'OperationError')
        ? 'Wrong password.'
        : 'Cannot decrypt here: ' + (x && x.message ? x.message : x);
      goEl.disabled = false;
      goEl.textContent = 'UNLOCK';
      pwEl.select();
    }
  });
}
